apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
        - name: worker
          image: myregistry.io/worker:v1.5.2
          envFrom:
            - configMapRef:
                name: worker-config-missing
            - secretRef:
                name: worker-secrets-missing
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
