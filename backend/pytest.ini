[pytest]
# Discover tests in the tests/ directory
testpaths = tests

# Enable asyncio mode so async test functions run without extra decorators
asyncio_mode = auto

# Shorter traceback for readability
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers (add more as test surface grows)
markers =
    unit: Pure unit tests with no I/O
    integration: Tests that hit a running service
